name: Static Check

# 组织级可复用 workflow —— 供无构建步骤的静态站点仓库调用
# （hub / nightcord / stickers / 25ji-sagyo）以及纯 JS 的 Worker 仓（gateway）。
#
# 调用方式：
#   jobs:
#     check:
#       uses: 25-ji-code-de/.github/.github/workflows/static-check.yml@main
#
# 之所以做成可复用而不是各仓复制一份：生态里已经因为复制粘贴产生过
# 四份漂移的 auth 客户端，CI 不要重蹈覆辙。
#
# 检查逻辑在 scripts/static-check.mjs，不内联在这里 —— 内联进
# `node -e '...'` 曾经被 bash 单引号坑过一次（CSP 校验的正则含 'self'，
# 直接把 bash 字符串截断）。

on:
  workflow_call:
    inputs:
      node-version:
        description: Node 版本。默认 24（Node 20 已于 2026-04 EOL）
        type: string
        default: '24'
      ignore-pattern:
        description: 跳过检查的路径正则（压缩过的第三方库等）
        type: string
        default: 'node_modules|[\\/]libs[\\/]|\.min\.js$|package-lock\.json$'

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo under test
        uses: actions/checkout@v4

      - name: Checkout shared scripts
        uses: actions/checkout@v4
        with:
          repository: 25-ji-code-de/.github
          path: _sekai_meta

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run static checks
        run: node _sekai_meta/scripts/static-check.mjs . '${{ inputs.ignore-pattern }}'
